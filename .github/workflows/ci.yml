name: Rutitas Backend - CI SDD y dotnet

on:
  pull_request:
    branches: [main, 'feature/sdd-azure-devsecops']
  push:
    branches: [main, 'feature/ci-cd-*', 'fix/mark-api-devsecops-review']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdd-and-security:
    name: SDD, YAML y Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validar sintaxis YAML de los workflows
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file, aliases: true) }; puts "Sintaxis YAML válida."' \
            .github/workflows/ci.yml .github/workflows/package-release.yml
      - name: Validar documentos SDD existentes
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md AGENTS.md memoria.md .specify/memory/constitution.md \
              specs/000-arquitectura-base/spec.md specs/000-arquitectura-base/plan.md \
              specs/000-arquitectura-base/task.md; do
            test -s "$file" || { echo "::error::Falta o está vacío: $file"; exit 1; }
          done
          echo 'SDD documental presente; no equivale a Constitución ratificada.' >> "$GITHUB_STEP_SUMMARY"
      - name: Gitleaks (historial Git completo)
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git --redact --exit-code 1 /repo

  detect-project:
    name: Detectar solución .NET
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.detect.outputs.present }}
      project: ${{ steps.detect.outputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Detectar solución
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          project="$(find . -type f \( -name '*.slnx' -o -name '*.sln' \) -not -path './.git/*' -print -quit)"
          if [ -z "$project" ]; then
            echo '::error::No se encontró solución .NET.'
            exit 1
          fi
          echo 'present=true' >> "$GITHUB_OUTPUT"
          echo "project=${project#./}" >> "$GITHUB_OUTPUT"

  dotnet-build-test:
    name: .NET 10 - build, análisis, auditoría y cinco suites
    needs: [sdd-and-security, detect-project]
    if: needs.detect-project.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Instalar SDK verificado de global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - name: Restaurar con auditoría de NuGet
        env:
          PROJECT: ${{ needs.detect-project.outputs.project }}
        run: dotnet restore "$PROJECT" -p:NuGetAudit=true -p:NuGetAuditMode=all
      - name: Compilar Release
        env:
          PROJECT: ${{ needs.detect-project.outputs.project }}
        run: dotnet build "$PROJECT" --configuration Release --no-restore
      - name: Analizar C# con todos los analizadores .NET
        env:
          PROJECT: ${{ needs.detect-project.outputs.project }}
        run: >-
          dotnet build "$PROJECT" --configuration Release --no-restore --no-incremental
          -p:EnableNETAnalyzers=true -p:AnalysisMode=All -p:RunAnalyzersDuringBuild=true
      - name: Auditar vulnerabilidades NuGet directas y transitivas
        env:
          PROJECT: ${{ needs.detect-project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet package list --project "$PROJECT" --vulnerable --include-transitive --format json > nuget-vulnerabilities.json
          python3 - <<'PY'
          import json
          data = json.load(open('nuget-vulnerabilities.json', encoding='utf-8'))
          def findings(node):
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key == 'vulnerabilities' and isinstance(value, list):
                          yield from value
                      else:
                          yield from findings(value)
              elif isinstance(node, list):
                  for value in node:
                      yield from findings(value)
          count = sum(1 for _ in findings(data))
          print(f'NuGet advisories encontrados: {count}')
          if count:
              raise SystemExit('Revisar vulnerabilidades NuGet antes de integrar.')
          PY
      - name: Ejecutar exactamente cinco suites con TRX y Cobertura
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' test_projects < <(
            find Rutitas.Api/tests -type f -name '*Tests.csproj' -not -path './.git/*' -print0 | sort -z
          )
          if (( ${#test_projects[@]} != 5 )); then
            echo "::error::Se esperaban cinco proyectos de pruebas; se encontraron ${#test_projects[@]}."
            exit 1
          fi
          mkdir -p test-results
          for project in "${test_projects[@]}"; do
            name="$(basename "$project" .csproj)"
            result_dir="test-results/$name"
            mkdir -p "$result_dir"
            echo "::group::Ejecutando $name"
            dotnet test "$project" --configuration Release --no-build --no-restore \
              --logger "trx;LogFileName=$name.trx" --results-directory "$result_dir" \
              --collect:"XPlat Code Coverage"
            echo "::endgroup::"
          done
      - name: Conservar TRX y cobertura
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dotnet-test-results
          path: |
            test-results/**/*.trx
            test-results/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14
      - name: Conservar auditoría NuGet
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nuget-vulnerability-audit
          path: nuget-vulnerabilities.json
          if-no-files-found: warn
          retention-days: 14
