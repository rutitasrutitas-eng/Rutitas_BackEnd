name: Rutitas Backend - CI SDD y dotnet

on:
  pull_request:
    branches: [main, 'feature/sdd-azure-devsecops']
  push:
    branches: [main, 'feature/ci-cd-*', 'fix/mark-api-devsecops-review']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdd-and-security:
    name: SDD y escaneo de secretos (no compila API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validar sintaxis YAML de los workflows
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file, aliases: true) }; puts "Sintaxis YAML válida."' \
            .github/workflows/ci.yml .github/workflows/package-release.yml
      - name: Validar documentos SDD existentes
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md AGENTS.md memoria.md .specify/memory/constitution.md \
              specs/000-arquitectura-base/spec.md specs/000-arquitectura-base/plan.md \
              specs/000-arquitectura-base/task.md; do
            test -s "$file" || { echo "::error::Falta o está vacío: $file"; exit 1; }
          done
          echo 'SDD documental presente: NO equivale a Constitución ratificada.' >> "$GITHUB_STEP_SUMMARY"
      - name: Gitleaks (historial Git completo)
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 git --redact --exit-code 1 /repo

  detect-project:
    name: Detectar solución o proyecto .NET
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.detect.outputs.present }}
      project: ${{ steps.detect.outputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Detección de solución
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          project="$(find . -type f \( -name '*.slnx' -o -name '*.sln' \) -not -path './.git/*' -print -quit)"
          if [ -z "$project" ]; then
            project="$(find . -type f -name '*.csproj' -not -path './.git/*' -print -quit)"
          fi
          if [ -z "$project" ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'No existe solución/proyecto .NET versionado; build y tests NO ejecutados.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo "project=${project#./}" >> "$GITHUB_OUTPUT"
          fi

  dotnet-build:
    name: .NET - restore, build y tests
    needs: [sdd-and-security, detect-project]
    if: needs.detect-project.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exigir SDK definido para esta solución
        shell: bash
        run: test -s global.json || { echo '::error::Falta global.json; el SDK no se selecciona por inferencia.'; exit 1; }
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - name: Exigir proyecto de pruebas
        shell: bash
        run: |
          set -euo pipefail
          testproj="$(find . -type f \( -name '*Tests.csproj' -o -name '*Test.csproj' \) -print -quit)"
          test -n "$testproj" || { echo '::error::No se encontró proyecto de pruebas .NET; CI incompleto'; exit 1; }
      - name: Restaurar, compilar y ejecutar TODOS los proyectos de pruebas
        shell: bash
        env:
          PROJECT: ${{ needs.detect-project.outputs.project }}
        run: |
          set -euo pipefail
          dotnet restore "$PROJECT" -p:NuGetAudit=true -p:NuGetAuditMode=all
          dotnet build "$PROJECT" --configuration Release --no-restore

          # El análisis de código produce diagnósticos revisables; su umbral
          # de bloqueo se aprobará tras clasificar la línea base.
          dotnet build "$PROJECT" --configuration Release --no-restore \
            -p:EnableNETAnalyzers=true -p:AnalysisMode=All \
            -p:RunAnalyzersDuringBuild=true

          dotnet package list --project "$PROJECT" --vulnerable \
            --include-transitive --format json > nuget-vulnerabilities.json
          python3 - <<'PY'
          import json
          data = json.load(open('nuget-vulnerabilities.json', encoding='utf-8'))
          def findings(node):
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key == 'vulnerabilities' and isinstance(value, list):
                          yield from value
                      else:
                          yield from findings(value)
              elif isinstance(node, list):
                  for value in node:
                      yield from findings(value)
          count = sum(1 for _ in findings(data))
          print(f'NuGet advisories encontrados: {count}')
          if count:
              raise SystemExit('Revisar vulnerabilidades NuGet antes de integrar.')
          PY

          # Probar explícitamente los proyectos de test; dotnet test sobre una API
          # no garantiza ejecutar tests cuando no hay un .sln/.slnx.
          mapfile -d '' test_projects < <(
            find . -type f \
              \( -name '*Tests.csproj' -o -name '*Test.csproj' \) \
              -not -path './.git/*' -print0
          )
          if (( ${#test_projects[@]} == 0 )); then
            echo '::error::No existen proyectos de tests verificables.'
            exit 1
          fi
          if (( ${#test_projects[@]} != 5 )); then
            echo "::error::Se esperaban cinco proyectos de pruebas; se encontraron ${#test_projects[@]}."
            exit 1
          fi
          for test_project in "${test_projects[@]}"; do
            echo "::group::Ejecutando tests: $test_project"
            dotnet test "$test_project" --configuration Release \
              --no-restore --logger 'trx;LogFileName=test-results.trx' \
              --collect 'XPlat Code Coverage'
            echo '::endgroup::'
          done
      - name: Conservar reportes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dotnet-test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14
      - name: Conservar auditoría NuGet
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: nuget-vulnerability-audit
          path: nuget-vulnerabilities.json
          if-no-files-found: warn
          retention-days: 14
