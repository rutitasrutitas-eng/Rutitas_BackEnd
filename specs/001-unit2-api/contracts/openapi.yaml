openapi: 3.1.0
info:
  title: Rutitas API - Unidad II
  version: 1.0.0-draft
  description: |
    Contrato propuesto para los 7 endpoints de autenticación, perfil propio
    y consulta de rutas de Rutitas Backend. Ya existe implementación local observada;
    el contrato continúa propuesto hasta aprobación de BACKEND-D06.
    Este documento no autoriza despliegue ni representa aprobación académica.
  contact:
    name: Equipo Rutitas Backend
servers:
  - url: https://localhost:7291/api/v1
    description: Desarrollo local observado en Visual Studio; no accesible desde Internet
  - url: https://api.rutitas.example/api/v1
    description: URL ilustrativa de despliegue futuro; no existe ni está aprobada
x-phase: Unidad II (3-4 nov 2026)
x-verification: pruebas_locales_reportadas_63_ok_2026-11-06_no_verificadas_en_esta_revision
x-cloud-deployment: no_verificado
x-mobile-contract-approval: pendiente
x-status: propuesto
x-implementation: implementacion_local_observada
x-decisions:
  - BACKEND-D05
  - BACKEND-D06
  - BACKEND-D09
  - BACKEND-D10
  - BACKEND-D11
  - BACKEND-D13
tags:
  - name: Auth
    description: Registro, login y logout.
  - name: Users
    description: Perfil del usuario autenticado.
  - name: Routes
    description: Consulta de rutas activas y visibles.
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Registrar una cuenta
      description: Crea una cuenta con email único. No devuelve token; el cliente debe iniciar sesión después.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Cuenta creada.
          headers:
            Location:
              description: URI del perfil creado.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Iniciar sesión
      description: Valida credenciales y devuelve un JWT de acceso. Credenciales inválidas usan un mensaje genérico.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Cerrar sesión
      description: Revoca el jti del token actual. Es idempotente; un token revocado produce 401.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sesión revocada o ya revocada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Consultar mi perfil
      description: Devuelve el perfil derivado exclusivamente del claim sub del token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      summary: Actualizar mi perfil
      description: Actualiza displayName y/o phone. No permite cambiar email, contraseña ni rol.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProfileRequest'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /routes:
    get:
      tags: [Routes]
      operationId: listRoutes
      summary: Listar rutas
      description: Lista rutas activas y visibles con paginación y búsqueda opcional.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Página de rutas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRoutes'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /routes/{id}:
    get:
      tags: [Routes]
      operationId: getRouteById
      summary: Consultar detalle de ruta
      description: Devuelve una ruta activa y visible por ObjectId.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId hexadecimal de 24 caracteres.
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
            example: '507f1f77bcf86cd799439011'
      responses:
        '200':
          description: Detalle de la ruta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{7,14}$'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
    LoginResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: JWT de acceso. No debe registrarse en logs.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Segundos de vigencia del token.
          minimum: 1
        user:
          $ref: '#/components/schemas/UserProfile'
    UserProfile:
      type: object
      additionalProperties: false
      required: [id, email, displayName, role, createdAt]
      properties:
        id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{7,14}$'
        role:
          type: string
          enum: [user]
        createdAt:
          type: string
          format: date-time
    PatchProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{7,14}$'
    PagedRoutes:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RouteSummary'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    RouteSummary:
      type: object
      additionalProperties: false
      required: [id, code, name, origin, destination, distanceKm, estimatedDurationMin]
      properties:
        id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        code:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 120
        origin:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        distanceKm:
          type: number
          minimum: 0
        estimatedDurationMin:
          type: integer
          minimum: 0
    RouteDetail:
      type: object
      additionalProperties: false
      required: [id, code, name, description, origin, destination, stops, distanceKm, estimatedDurationMin]
      properties:
        id:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        code:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        origin:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Stop'
        distanceKm:
          type: number
          minimum: 0
        estimatedDurationMin:
          type: integer
          minimum: 0
    Location:
      type: object
      additionalProperties: false
      required: [name, lat, lng]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    Stop:
      type: object
      additionalProperties: false
      required: [order, name, lat, lng]
      properties:
        order:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 160
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
        traceId:
          type: string
    ValidationProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, traceId, errors]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    BadRequest:
      description: Datos de entrada inválidos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    Unauthorized:
      description: Token ausente, inválido, expirado o revocado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Recurso no encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflicto de unicidad, por ejemplo email ya registrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Límite de solicitudes excedido.
      headers:
        Retry-After:
          description: Segundos sugeridos antes de reintentar.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: Error interno sin detalles sensibles.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
