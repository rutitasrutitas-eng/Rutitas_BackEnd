- 'DEL-V24: 200 cancelacion perdido -> login nuevo active verifica, fallo no concluyente'
- 'DEL-V25: reautenticacion restringida tras caducar token antes del plazo sin extenderlo'
- 'DEL-V26: token expirado no se reutiliza, no emitir token nuevo al vencer'
- 'DEL-V27: 409 conflicto transitorio frente a 410 vencimiento o deleting'
- 'DEL-V28: GET estado vencido no reclamado -> 200 recoveryAllowed=false con token previo vigente'

