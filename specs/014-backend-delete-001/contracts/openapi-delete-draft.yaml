openapi: 3.1.0
info:
  title: Rutitas — BACKEND-DELETE-001 / ANDROID-DELETE-001
  version: 0.1.0-draft
  description: >-
    Propuesta conjunta Backend–Android. NO implementada, NO aprobada como contrato
    definitivo. Complemento aislado del contrato existente en
    specs/001-unit2-api/contracts/openapi.yaml; no reemplaza sus siete operaciones.
servers:
  - url: http://10.0.2.2:8080/api/v1
    description: Emulador Android hacia API local; solo pruebas autorizadas en dispositivo emulado.
tags:
  - name: AccountDeletion
    description: Eliminación programada, reautenticación limitada y cancelación.
paths:
  /users/me:
    delete:
      tags: [AccountDeletion]
      operationId: scheduleMyAccountDeletion
      summary: Solicitar eliminación programada
      description: >-
        Requiere JWT ordinario de cuenta active. En una transición atómica cambia
        a pending_deletion, incrementa sessionVersion y fija deleteAfterUtc
        exactamente siete días después de requestedAtUtc. El acceso normal queda
        bloqueado inmediatamente. Si una solicitud concurrente llega mientras
        la cuenta sigue active, no debe extender el plazo ya fijado. Un reintento
        posterior con JWT normal ya invalidado puede recibir 401: la persistencia
        idempotente NO implica repetir necesariamente la respuesta 202. La UX
        podrá iniciar recuperación para consultar el estado.
      security:
        - ordinaryBearer: []
      responses:
        '202':
          description: Eliminación programada registrada con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionStatus'
              example:
                status: pending_deletion
                requestedAtUtc: '2026-11-18T15:00:00Z'
                deleteAfterUtc: '2026-11-25T15:00:00Z'
                recoveryAllowed: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /users/me/deletion:
    get:
      tags: [AccountDeletion]
      operationId: getMyAccountDeletionStatus
      summary: Consultar estado de eliminación pendiente
      description: >-
        Acceso exclusivamente mediante la credencial restringida de recuperación
        para una cuenta pending_deletion. No habilita el JWT ordinario suspendido.
        La API no expone datos del perfil. Si el proceso irreversible ya comenzó,
        no ofrece recuperación. Definir retención mínima y respuesta tras borrado
        definitivo en revisión de privacidad.
      security:
        - recoveryBearer: []
      responses:
        '200':
          description: Estado de eliminación del titular.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionStatus'
              example:
                status: pending_deletion
                requestedAtUtc: '2026-11-18T15:00:00Z'
                deleteAfterUtc: '2026-11-25T15:00:00Z'
                recoveryAllowed: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/deletion/recovery:
    post:
      tags: [AccountDeletion]
      operationId: authenticateForDeletionRecovery
      summary: Reautenticación restringida para cuenta pendiente de eliminación
      description: >-
        Verifica credenciales sin exigir un JWT ordinario activo. Solo cuentas
        pending_deletion antes del vencimiento podrán obtener una credencial
        opaca de un solo uso por cancelación, de vida corta (300 s propuestos)
        y con permisos deletion:read y deletion:cancel. Consultar el estado NO
        consume la credencial; una cancelación exitosa sí. Debe almacenarse solo
        su hash y protegerse con rate limiting. Credenciales incorrectas, cuenta
        inexistente o no elegible no deben facilitar enumeración de usuarios.
        El uso concreto de 410 en este endpoint requiere revisión de privacidad
        para evitar enumeración; por defecto devolver 401 genérico ante falta
        de elegibilidad.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryAuthenticationRequest'
            example:
              email: estudiante.ficticio@example.test
              password: '<credencial-ficticia-no-real>'
      responses:
        '200':
          description: Credencial de recuperación emitida.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryAuthenticationResponse'
              example:
                recoveryToken: '<valor-opaco-omitido>'
                tokenType: Bearer
                expiresIn: 300
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /users/me/deletion/cancel:
    post:
      tags: [AccountDeletion]
      operationId: cancelMyAccountDeletion
      summary: Cancelar eliminación durante el plazo de recuperación
      description: >-
        Solo con credencial de recuperación válida, no consumida y ligada al
        titular. La condición atómica exige status=pending_deletion,
        nowUtc < deleteAfterUtc y borrado irreversible no iniciado.
        Restaura active e incrementa sessionVersion. La credencial se consume
        atómicamente o mediante mecanismo que resista reintentos y concurrencia;
        ninguna sesión antigua vuelve a ser válida. El usuario debe realizar
        nuevo login normal. Una interrupción de MongoDB nunca debe confirmarse
        como cancelación exitosa.
      security:
        - recoveryBearer: []
      responses:
        '200':
          description: Cancelación confirmada; cuenta activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionCancellationResponse'
              example:
                status: active
                deletionCancelled: true
                requiresLogin: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    ordinaryBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT normal existente; se exige status=active, jti no revocado y
        sessionVersion válido. No admite credenciales restringidas.
    recoveryBearer:
      type: http
      scheme: bearer
      description: >-
        Credencial opaca temporal exclusivamente para deletion:read y
        deletion:cancel, validada mediante política separada y servidor.
        No puede pasar la validación JWT ordinaria.
  schemas:
    DeletionStatus:
      type: object
      additionalProperties: false
      required: [status, requestedAtUtc, deleteAfterUtc, recoveryAllowed]
      properties:
        status:
          type: string
          enum: [pending_deletion, deleting]
        requestedAtUtc:
          type: string
          format: date-time
          description: Instante UTC de la primera solicitud válida.
        deleteAfterUtc:
          type: string
          format: date-time
          description: requestedAtUtc más exactamente siete días.
        recoveryAllowed:
          type: boolean
          description: True únicamente antes de vencer y antes de iniciar borrado irreversible.
    RecoveryAuthenticationRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
    RecoveryAuthenticationResponse:
      type: object
      additionalProperties: false
      required: [recoveryToken, tokenType, expiresIn]
      properties:
        recoveryToken:
          type: string
          minLength: 1
          description: Secreto temporal, nunca registrar en logs.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Segundos; 300 s propuestos, pendientes de aprobación.
    DeletionCancellationResponse:
      type: object
      additionalProperties: false
      required: [status, deletionCancelled, requiresLogin]
      properties:
        status:
          type: string
          const: active
        deletionCancelled:
          type: boolean
          const: true
        requiresLogin:
          type: boolean
          const: true
    ProblemDetails:
      type: object
      description: Cuerpo compatible con ProblemDetails; nunca filtrar datos privados ni secretos.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }
  responses:
    BadRequest:
      description: Solicitud inválida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { title: 'Invalid request.', status: 400 }
    Unauthorized:
      description: Credencial ausente, inválida, vencida o identidad no elegible.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { title: 'Authentication required.', status: 401 }
    Forbidden:
      description: Credencial válida pero sin el permiso requerido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { title: 'Action not permitted.', status: 403 }
    Conflict:
      description: Transición incompatible, borrado ya reclamado o conflicto concurrente.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { title: 'Account state conflict.', status: 409 }
    Gone:
      description: Plazo de recuperación vencido; se rechaza la cancelación.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { title: 'Recovery period expired.', status: 410 }
    TooManyRequests:
      description: Límite de intentos excedido.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { title: 'Too many requests.', status: 429 }
    Unavailable:
      description: No se confirmó la operación debido a un fallo temporal de dependencia.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example: { title: 'Service temporarily unavailable.', status: 503 }
